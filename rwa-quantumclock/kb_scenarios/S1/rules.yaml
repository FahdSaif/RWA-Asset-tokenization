# Scenario S1: the NIST deprecation date treated as a hard deadline for compliance-critical keys.

- id: SCN-S1-CRITICAL-2030
  description: "Scenario: compliance-critical keys must be migrated by the end of 2030."
  when:
    all:
      - {fact: quantum_vulnerable, is_true: true}
      - {fact: compliance_critical, is_true: true}
  then:
    deadline_hard: "2030-12-31"
  source:
    title: "NIST IR 8547 (final, October 2026), deprecation date treated as binding (scenario)"
    url: "https://nvlpubs.nist.gov/nistpubs/ir/2026/NIST.IR.8547.pdf"
    clause: "Scenario only: the 2030 deprecation date is applied as a hard deadline."
    accessed: "2026-11-28"
    verified: true
    scenario: true
