[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qamp"
version = "0.3.6"
description = "QAMP: a quantum-aware expert system that plans the post-quantum migration of compliance trust anchors in tokenised real-world-asset infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fahd Saifuddin" }]
keywords = ["post-quantum cryptography", "expert system", "tokenisation", "RWA", "compliance", "decision support", "migration planning"]
dependencies = ["numpy>=1.24", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qamp = "qamp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
