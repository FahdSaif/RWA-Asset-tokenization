# Standards and roadmaps. Each clause was checked against its source (verified: true). Paraphrased.

- id: NIST8547-DISALLOW
  description: "Old public-key algorithms are not allowed after 2035 (NIST)."
  when: {fact: quantum_vulnerable, is_true: true}
  then:
    deadline_hard: "2035-12-31"
  source:
    title: "NIST IR 8547, Transition to Post-Quantum Cryptography Standards (final, October 2026)"
    url: "https://nvlpubs.nist.gov/nistpubs/ir/2026/NIST.IR.8547.pdf"
    clause: "Quantum-vulnerable public-key algorithms are deprecated after 2030 and disallowed after 2035, regardless of key size."
    accessed: "2026-11-24"
    verified: true

- id: NIST8547-DEPRECATE
  description: "Old signatures, including ECDSA and EdDSA, are deprecated after 2030 (NIST)."
  when: {fact: quantum_vulnerable, is_true: true}
  then:
    deadline_soft: "2030-12-31"
  source:
    title: "NIST IR 8547 (final, October 2026); change from the November 2024 draft"
    url: "https://postquantum.com/security-pqc/nist-ir-8547-final/"
    clause: "The final report adds a deprecation step after 2030 for signatures at 128 bits or more (P-256, Ed25519), which the 2024 draft had left until 2035."
    accessed: "2026-11-24"
    verified: true

- id: G7-CRITICAL-FIRST
  description: "G7 example: most critical systems by 2030-32. Not binding."
  when:
    all:
      - {fact: quantum_vulnerable, is_true: true}
      - {fact: compliance_critical, is_true: true}
  then:
    target_date: "2032-12-31"
    flags: [g7_target_non_binding]
  source:
    title: "G7 Cyber Expert Group, Advancing a Coordinated Roadmap for the Transition to Post-Quantum Cryptography in the Financial Sector (January 2026)"
    url: "https://home.treasury.gov/system/files/136/G7-CEG-Quantum-Roadmap.pdf"
    clause: "2035 is cited as an overall target; 2030-32 is an example timeframe for the most critical systems; the roadmap is non-authoritative and not prescriptive."
    accessed: "2026-11-24"
    verified: true

- id: G7-OVERALL
  description: "G7 overall target for finance: 2035. Not binding."
  when: {fact: quantum_vulnerable, is_true: true}
  then:
    target_date: "2035-12-31"
    flags: [g7_target_non_binding]
  source:
    title: "G7 Cyber Expert Group PQC roadmap (January 2026)"
    url: "https://home.treasury.gov/system/files/136/G7-CEG-Quantum-Roadmap.pdf"
    clause: "2035 is cited as an overall target date; target dates are subject to change."
    accessed: "2026-11-24"
    verified: true
