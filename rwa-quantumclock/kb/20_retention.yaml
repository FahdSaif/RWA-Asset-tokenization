# How long signed compliance records must be kept. A record signed with an old key can be disputed
# if a quantum computer arrives before the keeping period ends.

- id: RET-FATF-R11
  description: "Keep transaction records at least 5 years (FATF)."
  when: {fact: signs_records, is_true: true}
  then:
    retention_years: 5
  source:
    title: "FATF Recommendation 11 (record keeping)"
    url: "https://cfatf-gafic.org/documents/fatf-40r/377-fatf-recommendation-11-record-keeping"
    clause: "Financial institutions should maintain all necessary transaction records for at least five years."
    accessed: "2026-11-24"
    verified: true

- id: RET-EU-AMLD-40
  description: "EU: keep records 5 years, up to 5 more (AML directive)."
  when:
    all:
      - {fact: signs_records, is_true: true}
      - {fact: jurisdictions, contains_any: [EU]}
  then:
    retention_years: 5
  source:
    title: "Directive (EU) 2015/849, Article 40"
    url: "https://www.eba.europa.eu/single-rule-book-qa/qna/view/publicId/2020_5362"
    clause: "Records are retained for five years from the end of the business relationship or the occasional transaction; a further period may not exceed five additional years."
    accessed: "2026-11-24"
    verified: true

- id: RET-US-SEC-17A4
  description: "US broker-dealers: keep records 6 years (SEC 17a-4)."
  when:
    all:
      - {fact: signs_records, is_true: true}
      - {fact: jurisdictions, contains_any: [US]}
  then:
    retention_years: 6
  source:
    title: "SEC Rule 17a-4(a), 17 CFR 240.17a-4"
    url: "https://www.ecfr.gov/current/title-17/chapter-II/part-240/subject-group-ECFR17722751b422db3/section-240.17a-4"
    clause: "Records under 17a-3(a)(1) and related paragraphs are preserved for not less than six years, the first two in an easily accessible place; other records for not less than three years."
    accessed: "2026-11-24"
    verified: true
