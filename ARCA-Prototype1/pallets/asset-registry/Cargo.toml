[package]
name = "pallet-asset-registry"
version = "0.1.0"
edition = "2021"
description = "ARCA Layer 4: token standard + authoritative per-asset metadata (thin)."
license = "Apache-2.0"

[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
frame-support = { version = "*", default-features = false }
frame-system = { version = "*", default-features = false }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "frame-support/std", "frame-system/std"]
